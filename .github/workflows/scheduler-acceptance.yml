name: Scheduler acceptance only
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler event without contacting GLaDOS
        run: |
          echo 'event=${{ github.event_name }}'
          echo 'schedule=${{ github.event.schedule }}'
          echo 'ref=${{ github.ref }}'
          date -u '+UTC %Y-%m-%d %H:%M:%S'
