name: GLaDOS Check-in

on:
  workflow_dispatch:
  schedule:
    # UTC 01:18 / 04:18 = 北京时间 09:18 / 12:18，每天两次。
    - cron: '18 1 * * *'
    - cron: '18 4 * * *'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --disable-pip-version-check -r requirements.txt

    - name: Test result reporting (offline)
      run: python -m unittest discover -s tests -v

    # 执行 签到脚本
    - name: Running checkin
      id: http
      continue-on-error: true
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Install standard browser fallback
      if: ${{ steps.http.outcome == 'failure' }}
      run: |
        python -m pip install --disable-pip-version-check -r requirements-browser.txt
        python -m playwright install --with-deps chromium

    - name: Check in through the official browser page
      id: browser
      if: ${{ !cancelled() && steps.http.outcome == 'failure' }}
      continue-on-error: true
      run: xvfb-run -a python browser_checkin.py
      env:
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        BROWSER_HEADLESS: 'false'

    - name: Require verified check-in credit
      if: ${{ !cancelled() }}
      run: |
        if [ '${{ steps.http.outcome }}' != success ] && [ '${{ steps.browser.outcome }}' != success ]; then
          echo '::error::HTTP 与正常浏览器均未核实今日签到入账；请检查官网人工验证。'
          exit 1
        fi

    # 签到失败时也要保活；独立维护步骤不改变签到的结果。
    - name: Enable and verify the daily schedule
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/gladosCheck.yml"
        state=$(gh api "$endpoint" --jq .state)
        if [ "$state" != active ]; then
          gh api --method PUT "$endpoint/enable"
          state=$(gh api "$endpoint" --jq .state)
        fi
        echo "Scheduler state: $state"
        test "$state" = active
        printf '## 自动执行安排\n\n北京时间每天 09:18、12:18；工作流启用状态：%s。\n' "$state" >> "$GITHUB_STEP_SUMMARY"
