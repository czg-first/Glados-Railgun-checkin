name: Inspect GLaDOS scheduler
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/schedule-diagnostics.yml']
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read and enable check-in workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/gladosCheck.yml"
          echo "BEFORE_ENABLE"
          gh api "$endpoint" --jq '{id,name,state,path,created_at,updated_at}'
          gh api --method PUT "$endpoint/enable"
          echo "AFTER_ENABLE"
          gh api "$endpoint" --jq '{id,name,state,path,updated_at}'
          test "$(gh api "$endpoint" --jq .state)" = "active"
